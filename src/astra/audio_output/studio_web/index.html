<div class="shell">
  <aside class="rail" aria-label="工作区导航">
    <div class="brand-mark" role="img" aria-label="Astra Studio"><img src="assets/astra-logo-v6.png" width="36" height="36" alt="" aria-hidden="true" draggable="false" style="display:block;width:36px;height:36px;object-fit:contain;flex:none"></div>
    <div class="rail-links" role="group" aria-label="项目操作">
      <button class="rail-button active" data-do="new" aria-label="新建转谱" title="新建转谱"><svg><use href="#i-plus"/></svg></button>
      <button class="rail-button" data-do="chooseProject" aria-label="打开项目" title="打开项目"><svg><use href="#i-folder"/></svg></button>
      <button class="rail-button" data-do="recent" aria-label="最近项目" title="最近项目"><svg><use href="#i-clock"/></svg></button>
    </div>
    <div class="rail-links rail-help">
      <button class="rail-button" data-do="appPreferences" aria-label="设置" title="设置：外观、音频输出、保存与恢复、快捷键"><svg><use href="#i-settings"/></svg></button>
      <button id="ncm-tool-button" class="rail-button" data-do="ncmTool" aria-label="NCM 音频转换" title="NCM 音频转换"><svg><use href="#i-convert"/></svg></button>
      <button class="rail-button" data-do="help" aria-label="使用说明" title="使用说明"><svg><use href="#i-help"/></svg></button>
    </div>
  </aside>

  <div class="stage">
    <header class="topbar">
      <div class="identity"><strong>Astra Studio</strong><span class="top-separator"></span><span id="breadcrumb">新建转谱</span></div>
      <div class="header-actions">
        <span class="local-status"><span></span>本机工作区</span>
        <button class="quiet icon-label" data-do="logs"><svg><use href="#i-terminal"/></svg><span>日志</span></button>
      </div>
    </header>
    <main id="workspace" tabindex="-1"></main>
    <footer id="transport" class="transport" hidden aria-label="试听控制">
      <div class="transport-source"><svg><use href="#i-track"/></svg><select id="source" aria-label="试听来源"></select></div>
      <div class="play-controls">
        <button id="play" class="play-button" data-do="playPause" aria-label="播放" title="播放"><svg><use href="#i-play"/></svg></button>
        <button class="stop-button" data-do="stop" aria-label="停止" title="停止 · 小键盘 0"><svg><use href="#i-stop"/></svg></button>
      </div>
      <output id="time">0:00</output><input id="seek" type="range" min="0" max="0" step="0.01" aria-label="试听进度"><output id="duration">0:00</output>
      <details id="volume-popup" class="volume volume-popover"><summary id="volume-summary" aria-label="音量，展开调整" title="音量 · 点击调整"><svg><use href="#i-volume"/></svg><span class="volume-muted-mark" aria-hidden="true">×</span></summary><div class="volume-popup-panel"><div id="volume-percent"><label for="volume">音量 <output id="volume-value">65%</output></label><input id="volume" type="range" min="0" max="100" value="65" aria-label="试听音量；0 为静音"></div></div></details>
      <div id="musical-transport" hidden></div>
      <button type="button" id="transport-fold" class="transport-fold" aria-expanded="true" aria-controls="transport" title="收起走带"><svg><use href="#i-chevron"/></svg></button>
    </footer>
  </div>
</div>
<div id="rhythm-context-menu" role="menu" hidden></div>
<div id="save-toast" class="save-toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
<dialog id="ncm-dialog" class="dialog" aria-labelledby="ncm-title">
  <header class="dialog-head"><h2 id="ncm-title">NCM 音频转换</h2><button type="button" class="icon-button" data-do="ncmClose" aria-label="关闭转换工具"><svg><use href="#i-close"/></svg></button></header>
  <div class="dialog-body ncm-body">
    <p class="form-note">在本机提取原有的 FLAC 或 MP3 音频，保留源文件。</p>
    <div class="ncm-output">
      <div class="ncm-output-label"><span>输出目录</span><strong class="truncate" id="ncm-output-path"></strong></div>
      <button type="button" class="secondary" data-do="ncmChooseOutput"><svg><use href="#i-folder"/></svg>选择目录</button>
    </div>
    <div class="ncm-queue-head"><h3>转换队列 <span id="ncm-count">0</span></h3><div>
      <button type="button" class="quiet" data-do="ncmClear" disabled>清空</button>
      <button type="button" class="secondary" data-do="ncmChooseFiles" autofocus><svg><use href="#i-plus"/></svg>添加 NCM</button>
    </div></div>
    <ul id="ncm-queue" class="ncm-queue" aria-label="所选 NCM 文件"></ul>
    <p id="ncm-empty" class="ncm-empty">添加一个或多个 .ncm 文件开始转换。</p>
    <div id="ncm-progress-area" hidden><progress id="ncm-progress" max="1" value="0" aria-label="NCM 转换进度"></progress><p id="ncm-status" role="status"></p><p id="ncm-background-note" class="form-note" hidden>关闭此窗口后，转换会在后台继续。</p></div>
    <p id="ncm-error" class="form-error" role="alert" hidden></p>
  </div>
  <footer class="dialog-foot ncm-foot">
    <button type="button" class="secondary" data-do="ncmOpenOutput" disabled><svg><use href="#i-folder"/></svg>打开输出目录</button>
    <button type="button" class="secondary" data-do="ncmCancel" hidden>停止剩余队列</button>
    <button type="button" class="primary" data-do="ncmStart" disabled><svg><use href="#i-convert"/></svg>开始转换</button>
  </footer>
</dialog>
<dialog id="gpu-choice" class="dialog" aria-labelledby="gpu-title"></dialog>
<dialog id="logs" class="dialog log-dialog" aria-labelledby="logs-title">
  <div class="dialog-head"><h2 id="logs-title">运行日志</h2><button class="icon-button" data-do="closeLogs" aria-label="关闭日志"><svg><use href="#i-close"/></svg></button></div>
  <pre id="log-lines" tabindex="0">处理步骤会显示在这里。</pre>
  <div class="dialog-foot"><button class="secondary" data-do="openLog" disabled>打开日志文件</button><button class="primary" data-do="closeLogs">完成</button></div>
</dialog>
<div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
<div id="review-toast" class="review-toast" role="status" hidden></div>
</body>
</html>
