[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-local-music"
version = "0.1.0"
description = "Astra Studio: local transcription, MIDI editing and score preparation"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSE-SCOPE.md"]
requires-python = ">=3.10,<3.13"
dependencies = [
  "mido==1.3.3",
  "music21==9.9.1",
  "numpy>=1.26,<3",
  "soundfile>=0.13,<0.14",
  "imageio-ffmpeg>=0.6,<0.7",
  "PySide6==6.12.0",
  "PySide6-PDF==6.12.0.140",
  "PySide6-WebEngine==6.12.0.140",
  "ncmdump-py==1.1.6",
  "harte-library==0.4.5",
  "samplerate==0.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
shared-audio = ["scipy>=1.11,<2"]
asio = ["sounddevice==0.5.6; sys_platform == 'win32'"]
test = ["pytest>=8,<10"]

[project.scripts]
astra = "astra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
astra = [
  "assets/*.ico",
  "studio_web/*.*", "studio_web/**/*.*",
  "audio_output/studio_web/*.*", "audio_output/studio_web/**/*.*",
]
